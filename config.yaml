models: {strong: claude-sonnet-4-6, fast: claude-haiku-4-5-20251001, writer: claude-opus-4-8}
# tiers: strong = reasoning/structure (strategy, facts, brief, outline);
#        writer = reader-facing prose (hook, section drafts, FAQ) — best quality;
#        fast = cheap utility steps. Nodes pick a tier; models are never hard-coded.
# model provider: anthropic | azure_openai | claude_code
#   claude_code = shell out to the local `claude` CLI (no API key; uses your
#   Claude Code login). Set CLAUDE_CODE_BIN to override the binary path.
provider: claude_code
azure_openai:
  # endpoint + key come from env: AZURE_OPENAI_ENDPOINT (the full Responses-API
  # URL incl. ?api-version=...) and AZURE_OPENAI_API_KEY — never from this file.
  # Azure "deployments" play the role of the strong/fast model tiers.
  # Fill in your deployment names (Azure portal -> your resource -> Deployments);
  # AZURE_OPENAI_DEPLOYMENT env var is the fallback for both tiers.
  deployments: {strong: "", fast: ""}
# USD per million tokens (update alongside model changes)
pricing:
  strong: {input_per_mtok: 3.00, output_per_mtok: 15.00}
  fast: {input_per_mtok: 1.00, output_per_mtok: 5.00}
  writer: {input_per_mtok: 15.00, output_per_mtok: 75.00}
  # NOTE: the values above are Claude prices. On azure_openai, set them to your
  # Azure deployment prices or cost figures in the runlog will be wrong.
route_back_cap: 2
budgets: {max_cost_usd_per_page: 3.0, max_minutes_per_page: 15}
ui_limits: {h1_chars: 60, meta_chars: 155, cta_words: 5}
word_budget: {feature: [1400, 1800], blog-listicle: [1800, 2600], guide: [2000, 3200], comparison: [1500, 2200], glossary: [800, 1400], landing: [600, 1200]}
rubric_pass_pct: 85
# GOAL gate — Information-Gain Score (the measurable value of a page that earns
# Google traffic). When enforce_information_gain is true, c19 fails any page
# scoring < pass_score or missing a hard pre-condition (value density, sourced
# freshness, zero unresolved [VERIFY]). Set false to score-only (advisory).
goal: {enforce_information_gain: true, pass_score: 70}
# SEO research provider for cold mode (c3/c4/c5). semrush uses the Analytics
# HTTP API with env SEMRUSH_API_KEY (NOT the MCP server); no key ⇒ honest stub.
research: {provider: semrush, semrush_database: us}
